name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-tests:
    name: Laya & Combined decision tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift toolchain
        run: swift --version
      - name: Run JEV decision suite
        run: scripts/test-jev.sh

  laya-server:
    name: Laya server syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile laya_systemone.py
        run: python -m py_compile Cuse/Laya/laya_systemone.py
